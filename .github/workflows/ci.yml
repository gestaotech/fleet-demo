name: CI - Sistema de Frota

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - feat/html-js-neon-vercel

permissions:
  contents: read

concurrency:
  group: fleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build e testes sem banco externo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar estrutura e build
        run: npm run build

      - name: Testar regressões do protótipo
        run: npm run test:legacy

      - name: Testes unitários
        run: npm test
